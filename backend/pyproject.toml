[project]
name = "raaga"
version = "0.1.0"
description = "RaaGamaalika: Carnatic raga recognizer"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "essentia>=2.1b6.dev1389",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
scripts = ["mirdata>=1.0"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raaga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
